<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد الشطرنج الأسطوري v2</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body {
            background-color: #0d0d12;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
        }
        h2 { color: #00ffcc; text-shadow: 0 0 10px #00ffcc; margin-bottom: 15px; }
        
        #board-container {
            width: 100%;
            max-width: 380px;
            margin: 0 auto 15px auto;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.2);
            border: 2px solid #00ffcc;
            border-radius: 8px;
            padding: 5px;
            background-color: #1a1a24;
        }

        .white-1e1d7 { background-color: #dee3e6; }
        .black-3c85d { background-color: #8a96a3; }

        .btn {
            background-color: transparent;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 10px 15px;
            margin: 5px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn:hover { background-color: #00ffcc; color: #0d0d12; box-shadow: 0 0 15px #00ffcc; }
        
        .btn-undo { border-color: #ffcc00; color: #ffcc00; }
        .btn-undo:hover { background-color: #ffcc00; color: #000; box-shadow: 0 0 15px #ffcc00; }

        #status-display {
            margin-top: 15px;
            font-size: 1.1em;
            font-weight: bold;
            color: #00ffcc;
            min-height: 50px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        /* تمييز المربعات عند الحركة */
        .highlight-move { position: relative; }
        .highlight-move::after {
            content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 30%; height: 30%; background-color: rgba(0, 255, 204, 0.6); border-radius: 50%;
        }
        .highlight-ai-from { background-color: rgba(255, 255, 0, 0.4) !important; } /* أصفر لمكان الانطلاق */
        .highlight-ai-to { background-color: rgba(0, 255, 204, 0.5) !important; }  /* نيون لمكان الاستقرار */
        .highlight-selected { background-color: rgba(0, 255, 204, 0.4) !important; }

        #team-selector {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(13, 13, 18, 0.98); z-index: 1000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .team-btn { font-size: 1.4em; padding: 15px 30px; margin: 10px; border-radius: 12px; cursor: pointer; border: 2px solid #00ffcc; font-weight: bold; }
        .team-white { background-color: #fff; color: #000; }
        .team-black { background-color: #222; color: #fff; border-color: #ff0055; }
    </style>
</head>
<body>

    <div id="team-selector">
        <h2>اختر فريقك ⚔️</h2>
        <button class="team-btn team-white" onclick="setTeam('w')">العب بالأبيض ⚪</button>
        <button class="team-btn team-black" onclick="setTeam('b')">العب بالأسود ⚫</button>
    </div>

    <h2>♟️ المساعد الذكي</h2>
    
    <div id="board-container"><div id="board"></div></div>
    
    <div id="status-display">حدد فريقك للبدء...</div>

    <div style="margin-top: 10px;">
        <button id="best-move-btn" class="btn" onclick="getBestMove()">أوجد أفضل نقلة 🧠</button>
        <button class="btn btn-undo" onclick="undoMove()">تراجع خطوة ↩️</button>
        <button class="btn" onclick="resetGame()">إعادة ♻️</button>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
        var board = null;
        var game = new Chess();
        var selectedSquare = null;
        var playerTeam = 'w';

        // ترجمة القطع للعربية
        const pieceNames = { 'p': 'جندي', 'n': 'حصان', 'b': 'فيل', 'r': 'قلعة', 'q': 'وزير', 'k': 'ملك' };

        var config = {
            draggable: false,
            position: 'start',
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        };
        board = Chessboard('board', config);

        function setTeam(color) {
            playerTeam = color;
            document.getElementById('team-selector').style.display = 'none';
            board.orientation(color === 'b' ? 'black' : 'white');
            updateGameStatus();
        }

        function updateGameStatus(moveDesc = "") {
            if (game.game_over()) {
                document.getElementById('status-display').innerHTML = "انتهت اللعبة! 🏁";
                $('#best-move-btn').hide();
                return;
            }

            let turnText = game.turn() === playerTeam ? 
                "<span style='color:#00ffcc'>دورك الآن.. اضغط على الزر</span>" : 
                "<span style='color:#ff0055'>بانتظار حركة الخصم... ⏳</span>";
            
            document.getElementById('status-display').innerHTML = (moveDesc ? moveDesc + "<br>" : "") + turnText;
            
            if (game.turn() === playerTeam) $('#best-move-btn').show();
            else $('#best-move-btn').hide();
        }

        function removeHighlights() {
            $('#board .square-55d63').removeClass('highlight-ai-from highlight-ai-to highlight-selected highlight-move');
        }

        // حركة التراجع (تتراجع خطوة واحدة في كل ضغطة)
        function undoMove() {
            game.undo();
            board.position(game.fen());
            removeHighlights();
            updateGameStatus("تم التراجع عن الخطوة الأخيرة ↩️");
        }

        // التعامل مع الضغط اليدوي (حركة الخصم)
        $('#board').on('click', '.square-55d63', function() {
            var square = $(this).attr('data-square');
            var piece = game.get(square);

            if (selectedSquare) {
                var move = game.move({ from: selectedSquare, to: square, promotion: 'q' });
                if (move) {
                    board.position(game.fen());
                    removeHighlights();
                    selectedSquare = null;
                    updateGameStatus();
                    return;
                }
            }

            removeHighlights();
            if (piece && piece.color === game.turn()) {
                selectedSquare = square;
                $(this).addClass('highlight-selected');
                game.moves({ square: square, verbose: true }).forEach(m => {
                    $('#board .square-' + m.to).addClass('highlight-move');
                });
            } else { selectedSquare = null; }
        });

        // تشغيل الذكاء الاصطناعي
        function getBestMove() {
            var fen = game.fen();
            document.getElementById('status-display').innerText = "جاري التحليل الأسطوري... 🧠";
            $('#best-move-btn').hide();

            fetch(`https://stockfish.online/api/s/v2.php?fen=${fen}&depth=15`)
                .then(response => response.json())
                .then(data => {
                    if(data.success) {
                        let bestMoveStr = data.bestmove.split(" ")[1];
                        let fromSq = bestMoveStr.substring(0, 2);
                        let toSq = bestMoveStr.substring(2, 4);
                        
                        let pieceMoved = game.get(fromSq);
                        let move = game.move({ from: fromSq, to: toSq, promotion: 'q' });

                        board.position(game.fen());
                        removeHighlights();
                        
                        // رسم "الأسهم" عن طريق تلوين المربعات
                        $(`.square-${fromSq}`).addClass('highlight-ai-from');
                        $(`.square-${toSq}`).addClass('highlight-ai-to');

                        let desc = `✅ نقلة ذكية: حركت الـ <b>${pieceNames[pieceMoved.type]}</b> من <b>${fromSq}</b> إلى <b>${toSq}</b>`;
                        updateGameStatus(desc);
                    }
                });
        }

        function resetGame() {
            game.reset(); board.start(); removeHighlights();
            document.getElementById('team-selector').style.display = 'flex';
        }
    </script>
</body>
</html>
