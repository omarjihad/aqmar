<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NFT Battle Clone</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #101014;
            --bg-card: #18181f;
            --ton-blue: #0088cc;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --accent-purple: #8a2be2;
            --btn-deposit: #4a4a5a;
        }

        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; user-select: none; }
        body { background-color: var(--bg-main); color: var(--text-main); overflow-x: hidden; padding-bottom: 80px; }

        /* الهيدر العلوي مثل الفيديو */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; background: #15151a; position: sticky; top: 0; z-index: 100;
        }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 35px; height: 35px; border-radius: 50%; background: #333; border: 2px solid #444; }
        .balance-container { text-align: center; }
        .balance-title { font-size: 10px; color: var(--text-muted); }
        .balance-amount { font-size: 16px; font-weight: 900; color: #00e6ff; display: flex; align-items: center; gap: 5px; justify-content: center; }
        .btn-deposit { background: var(--btn-deposit); color: white; border: none; padding: 8px 15px; border-radius: 10px; font-weight: bold; font-size: 12px; }

        /* شريط الصناديق الملونة العلوية (Live Drops) */
        .live-drops {
            display: flex; gap: 10px; padding: 15px 20px; overflow-x: auto;
        }
        .drop-box { min-width: 45px; height: 45px; border-radius: 10px; background: linear-gradient(45deg, #ff416c, #ff4b2b); flex-shrink: 0; }
        .drop-box:nth-child(2) { background: linear-gradient(45deg, #8E2DE2, #4A00E0); }
        .drop-box:nth-child(3) { background: linear-gradient(45deg, #00b09b, #96c93d); }
        .drop-box:nth-child(4) { background: linear-gradient(45deg, #f7b733, #fc4a1a); }

        /* الحاوية الرئيسية */
        .container { padding: 0 20px; }

        /* البانرات الرئيسية (الصاروخ و PVP) */
        .banner {
            background: linear-gradient(135deg, #1f1f2e, #18181f);
            border-radius: 16px; padding: 20px; margin-bottom: 15px;
            position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,0.05);
            display: flex; justify-content: space-between; align-items: center;
        }
        .banner-title { font-size: 24px; font-weight: 900; font-style: italic; display: flex; align-items: center; gap: 10px; }
        .badge-hot { background: white; color: black; font-size: 10px; padding: 2px 6px; border-radius: 5px; font-weight: 900; margin-bottom: 5px; display: inline-block; }
        .badge-new { background: #ffaa00; color: black; font-size: 10px; padding: 2px 6px; border-radius: 5px; font-weight: 900; margin-bottom: 5px; display: inline-block; }
        .rocket-img { font-size: 50px; transform: rotate(45deg); }

        /* أزرار نصفية (Contracts / Upgrade) */
        .half-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .half-btn {
            background: #4a148c; border-radius: 12px; padding: 15px; font-weight: bold;
            display: flex; justify-content: space-between; align-items: center; color: white;
            background: linear-gradient(90deg, #3a0ca3, #4361ee);
        }
        .half-btn.green { background: linear-gradient(90deg, #00b4d8, #0077b6); }

        /* شبكة الصناديق المجانية وغيرها */
        .boxes-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .box-card {
            background: var(--bg-card); border-radius: 16px; padding: 15px; text-align: center;
            border: 1px solid rgba(255,255,255,0.05); position: relative;
        }
        .box-title { font-size: 20px; font-weight: 900; margin-bottom: 10px; }
        .box-img { font-size: 50px; margin-bottom: 10px; display: block; }
        .box-btn { background: rgba(255,255,255,0.1); color: white; border: none; padding: 5px 10px; border-radius: 8px; font-size: 12px; width: 100%; }

        /* شريط التنقل السفلي */
        .navbar {
            position: fixed; bottom: 0; width: 100%; background: #15151a; border-top: 1px solid #222;
            display: flex; justify-content: space-around; padding: 15px 0; z-index: 100;
        }
        .nav-item { color: var(--text-muted); font-size: 12px; text-align: center; opacity: 0.5; }
        .nav-item.active { color: white; opacity: 1; }
        .nav-icon { font-size: 20px; display: block; margin-bottom: 2px; }

    </style>
</head>
<body>

    <div class="header">
        <div class="user-info">
            <div class="avatar"></div>
        </div>
        <div class="balance-container">
            <div class="balance-title">Your balance</div>
            <div class="balance-amount"><span style="font-size:12px;">💎</span> 0.194</div>
        </div>
        <button class="btn-deposit">Deposit</button>
    </div>

    <div class="live-drops">
        <div class="drop-box"></div>
        <div class="drop-box"></div>
        <div class="drop-box"></div>
        <div class="drop-box"></div>
        <div class="drop-box"></div>
    </div>

    <div class="container">
        <div class="banner">
            <div>
                <span class="badge-hot">⚡ HOT!</span>
                <div class="banner-title">🚀 ROCKET</div>
            </div>
            <div class="rocket-img">🚀</div>
        </div>

        <div class="banner">
            <div>
                <span class="badge-new">✨ NEW!</span>
                <div class="banner-title">⚔️ PVP</div>
            </div>
            <div style="display:flex; gap: 5px;">
                <div class="avatar" style="width:25px;height:25px; border-color:#ffcc00;"></div>
                <div class="avatar" style="width:25px;height:25px; border-color:#00ff00;"></div>
            </div>
        </div>

        <div class="half-grid">
            <div class="half-btn">
                <span>📄 CONTRACTS</span> <span>></span>
            </div>
            <div class="half-btn green">
                <span>⬆️ UPGRADE</span> <span>></span>
            </div>
        </div>

        <div class="boxes-grid">
            <div class="box-card">
                <div class="box-title" style="color: #ffcc00;">FREE24</div>
                <span class="box-img">💍</span>
                <button class="box-btn" style="color:#ffcc00; border: 1px solid #ffcc00;">Free 24h</button>
            </div>
            <div class="box-card">
                <div class="box-title" style="color: #00ffcc;">FREE</div>
                <span class="box-img">🍬</span>
                <button class="box-btn">🎁 FREE</button>
            </div>
        </div>
    </div>

    <div class="navbar">
        <div class="nav-item active"><span class="nav-icon">🎮</span> Live</div>
        <div class="nav-item"><span class="nav-icon">📦</span> Cases</div>
        <div class="nav-item"><span class="nav-icon">🏆</span> Top</div>
        <div class="nav-item"><span class="nav-icon">👤</span> Profile</div>
    </div>

</body>
</html>
