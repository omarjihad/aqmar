<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rocket Crash - Pro Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #08080f;
            --bg-panel: #161622;
            --primary: #5d2de2;
            --success: #00e676;
            --danger: #ff3b30;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
        }

        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; user-select: none; }
        body { background-color: var(--bg-deep); color: var(--text-main); overflow: hidden; display: flex; flex-direction: column; height: 100vh; }

        /* الهيدر العلوي */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: rgba(8, 8, 15, 0.8); z-index: 100; }
        .online-status { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--success); font-weight: bold; }
        .dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; box-shadow: 0 0 8px var(--success); animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .balance-box { background: rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 12px; font-weight: 900; font-size: 15px; border: 1px solid rgba(255,255,255,0.2); }

        /* منطقة اللعبة (الفضاء) */
        .game-area { flex: 1; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; flex-direction: column; }
        .stars { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: url('https://www.transparenttextures.com/patterns/stardust.png'); opacity: 0.3; }
        
        .status-text { font-size: 14px; color: var(--text-muted); letter-spacing: 1px; margin-bottom: 10px; z-index: 10; text-transform: uppercase; }
        .multiplier { font-size: 80px; font-weight: 900; z-index: 10; text-shadow: 0 0 20px rgba(255,255,255,0.1); transition: color 0.2s; }
        
        /* الصاروخ والخط */
        .rocket-container { position: absolute; bottom: 10%; left: 10%; z-index: 5; display: none; transition: transform 0.1s linear; }
        .rocket-img { width: 80px; transform: rotate(45deg); filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5)); }
        
        /* خط الطيران (Trail) */
        .trail-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 4; pointer-events: none; }
        .trail-path { fill: none; stroke: url(#trailGradient); stroke-width: 4; stroke-linecap: round; filter: drop-shadow(0 0 8px rgba(0, 230, 118, 0.8)); }

        /* منطقة التحكم (الأسفل) */
        .controls { background: var(--bg-panel); padding: 20px; border-top-left-radius: 24px; border-top-right-radius: 24px; z-index: 10; box-shadow: 0 -10px 30px rgba(0,0,0,0.5); }
        
        /* اختيار السكنات */
        .skins-row { display: flex; gap: 10px; margin-bottom: 15px; justify-content: center; }
        .skin-btn { width: 45px; height: 45px; border-radius: 10px; background: #222; border: 2px solid transparent; padding: 5px; cursor: pointer; transition: 0.2s; }
        .skin-btn.active { border-color: var(--primary); background: rgba(93, 45, 226, 0.2); }
        .skin-btn img { width: 100%; height: 100%; object-fit: contain; }

        .bet-input-container { display: flex; background: #0c0c14; border-radius: 14px; padding: 6px; margin-bottom: 15px; border: 1px solid #2a2a35; }
        .bet-input-container button { background: transparent; border: none; color: white; font-size: 24px; width: 50px; cursor: pointer; }
        .bet-input-container input { flex: 1; background: transparent; border: none; color: white; text-align: center; font-size: 20px; font-weight: 900; outline: none; }

        .btn-action { width: 100%; padding: 18px; border-radius: 14px; font-size: 20px; font-weight: 900; color: white; border: none; cursor: pointer; transition: 0.2s; background: var(--primary); }
        .btn-action:active { transform: scale(0.96); }
        .btn-action.cashed { background: var(--success); color: black; }
        .btn-action.waiting { background: #333; color: var(--text-muted); cursor: not-allowed; }

        /* شريط الهستري */
        .history { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 15px; padding-bottom: 5px; }
        .history::-webkit-scrollbar { display: none; }
        .h-badge { padding: 4px 10px; border-radius: 8px; font-size: 13px; font-weight: bold; background: #2a2a35; white-space: nowrap; }
        .h-badge.good { color: var(--success); background: rgba(0, 230, 118, 0.1); border: 1px solid rgba(0, 230, 118, 0.2); }
        .h-badge.bad { color: var(--danger); background: rgba(255, 59, 48, 0.1); border: 1px solid rgba(255, 59, 48, 0.2); }

    </style>
</head>
<body>

    <div class="header">
        <div class="online-status">
            <div class="dot"></div> online
        </div>
        <div class="balance-box">💎 <span id="balance">100.00</span></div>
    </div>

    <div class="game-area">
        <div class="stars"></div>
        
        <svg class="trail-svg" preserveAspectRatio="none">
            <defs>
                <linearGradient id="trailGradient" x1="0%" y1="100%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="rgba(0, 230, 118, 0)" />
                    <stop offset="100%" stop-color="rgba(0, 230, 118, 1)" />
                </linearGradient>
            </defs>
            <path id="flight-path" class="trail-path" d="" />
        </svg>

        <div class="status-text" id="status-text">NEXT ROUND IN</div>
        <div class="multiplier" id="multi-text">5.0</div>
        
        <div class="rocket-container" id="rocket">
            <img src="https://cdn-icons-png.flaticon.com/512/3256/3256114.png" class="rocket-img" id="rocket-img">
        </div>
    </div>

    <div class="controls">
        <div class="history" id="history-bar">
            </div>

        <div class="skins-row">
            <div class="skin-btn active" onclick="changeSkin(this, 'https://cdn-icons-png.flaticon.com/512/3256/3256114.png')">
                <img src="https://cdn-icons-png.flaticon.com/512/3256/3256114.png"> </div>
            <div class="skin-btn" onclick="changeSkin(this, 'https://cdn-icons-png.flaticon.com/512/1940/1940842.png')">
                <img src="https://cdn-icons-png.flaticon.com/512/1940/1940842.png"> </div>
            <div class="skin-btn" onclick="changeSkin(this, 'https://cdn-icons-png.flaticon.com/512/2855/2855422.png')">
                <img src="https://cdn-icons-png.flaticon.com/512/2855/2855422.png"> </div>
        </div>

        <div class="bet-input-container">
            <button onclick="adjustBet(-0.5)">-</button>
            <input type="number" id="bet-input" value="1.00" step="0.5" min="0.5">
            <button onclick="adjustBet(0.5)">+</button>
        </div>

        <button class="btn-action" id="action-btn" onclick="handleAction()">ضع مبلغك (Bet)</button>
    </div>

    <script>
        // --- متغيرات محرك اللعبة ---
        let balance = 100.00;
        let gameState = 'waiting'; // waiting, flying, crashed
        let currentMultiplier = 1.00;
        let crashPoint = 1.00;
        let betAmount = 0;
        let userStatus = 'none'; // none, bet_placed, cashed_out
        
        // عناصر الـ DOM
        const multiText = document.getElementById('multi-text');
        const statusText = document.getElementById('status-text');
        const rocket = document.getElementById('rocket');
        const flightPath = document.getElementById('flight-path');
        const actionBtn = document.getElementById('action-btn');
        const balanceDisplay = document.getElementById('balance');
        const historyBar = document.getElementById('history-bar');
        const betInput = document.getElementById('bet-input');

        let gameInterval;
        let animationTime = 0;

        // --- دالة تغيير سكن الصاروخ ---
        function changeSkin(element, src) {
            document.querySelectorAll('.skin-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            document.getElementById('rocket-img').src = src;
        }

        function adjustBet(amount) {
            let current = parseFloat(betInput.value);
            let newVal = current + amount;
            if(newVal < 0.5) newVal = 0.5;
            betInput.value = newVal.toFixed(2);
        }

        // --- تحديث الرصيد ---
        function updateBalance(amount) {
            balance += amount;
            balanceDisplay.innerText = balance.toFixed(2);
        }

        // --- زر الأكشن (رهان / سحب) ---
        function handleAction() {
            if (gameState === 'waiting' && userStatus === 'none') {
                // وضع رهان
                let bet = parseFloat(betInput.value);
                if (bet > balance) { alert("رصيد غير كافٍ!"); return; }
                
                betAmount = bet;
                updateBalance(-betAmount);
                userStatus = 'bet_placed';
                
                actionBtn.innerText = "في الانتظار...";
                actionBtn.className = "btn-action waiting";
                
            } else if (gameState === 'flying' && userStatus === 'bet_placed') {
                // سحب الأرباح (Cashout)
                let winAmount = betAmount * currentMultiplier;
                updateBalance(winAmount);
                userStatus = 'cashed_out';
                
                actionBtn.innerText = `ربحت ${winAmount.toFixed(2)} 💎`;
                actionBtn.className = "btn-action cashed";
            }
        }

        // --- توليد نقطة الانفجار (نفس خوارزميات الكازينو) ---
        function generateCrashPoint() {
            // احتمالية 5% يطك فوراً على 1.00
            if (Math.random() < 0.05) return 1.00;
            // معادلة تعطي أرقام عشوائية (الأغلب بين 1 و 3، وقليل يوصل عالي)
            return Math.max(1.01, (0.99 / Math.random())).toFixed(2);
        }

        // --- إضافة للهستري ---
        function addToHistory(multiplier) {
            let badge = document.createElement('div');
            badge.innerText = multiplier + "x";
            badge.className = parseFloat(multiplier) >= 2.0 ? "h-badge good" : "h-badge bad";
            historyBar.prepend(badge);
            if (historyBar.children.length > 10) historyBar.removeChild(historyBar.lastChild);
        }

        // --- المحرك الرئيسي للعبة (Game Loop) ---
        function startRound() {
            gameState = 'waiting';
            currentMultiplier = 1.00;
            animationTime = 0;
            crashPoint = generateCrashPoint(); // تحديد نقطة الانفجار بالسر
            
            rocket.style.display = 'none';
            flightPath.setAttribute('d', '');
            multiText.style.color = 'var(--text-main)';
            statusText.innerText = "NEXT ROUND IN";
            
            if (userStatus !== 'bet_placed') {
                actionBtn.innerText = "ضع مبلغك (Bet)";
                actionBtn.className = "btn-action";
                userStatus = 'none';
            }

            // عداد الانتظار (5 ثواني)
            let countdown = 5.0;
            let waitInterval = setInterval(() => {
                countdown -= 0.1;
                multiText.innerText = countdown.toFixed(1);
                
                if (countdown <= 0) {
                    clearInterval(waitInterval);
                    launchRocket();
                }
            }, 100);
        }

        function launchRocket() {
            gameState = 'flying';
            statusText.innerText = "CURRENT PAYOUT";
            rocket.style.display = 'block';
            document.getElementById('rocket-img').src = document.querySelector('.skin-btn.active img').src; // إرجاع الصورة الأصلية إذا كانت منفجرة
            
            if (userStatus === 'bet_placed') {
                actionBtn.innerText = "سحب (Cashout)";
                actionBtn.className = "btn-action";
            }

            // بداية الإقلاع
            gameInterval = setInterval(() => {
                animationTime += 0.05;
                // زيادة المضاعف (Multiplier) بشكل أسي بسيط
                currentMultiplier += 0.005 * Math.pow(animationTime, 1.5);
                
                multiText.innerText = currentMultiplier.toFixed(2) + "x";

                // حركة الصاروخ ورسم الخط
                let startX = window.innerWidth * 0.1;
                let startY = window.innerHeight * 0.8;
                
                // معادلة المنحنى
                let currentX = startX + (animationTime * 30);
                let currentY = startY - (Math.pow(animationTime, 1.8) * 5);
                
                // منع الصاروخ من الخروج من الشاشة
                if(currentY < 100) currentY = 100;
                if(currentX > window.innerWidth * 0.8) currentX = window.innerWidth * 0.8;

                rocket.style.transform = `translate(${currentX - startX}px, ${currentY - startY}px)`;
                
                // رسم مسار الطيران (SVG)
                let pathD = `M ${startX+20} ${startY+20} Q ${currentX} ${startY} ${currentX+20} ${currentY+40}`;
                flightPath.setAttribute('d', pathD);

                // فحص الانفجار
                if (currentMultiplier >= crashPoint) {
                    crashRocket();
                }

            }, 30);
        }

        function crashRocket() {
            clearInterval(gameInterval);
            gameState = 'crashed';
            
            multiText.style.color = 'var(--danger)';
            statusText.innerText = "CRASHED AT";
            document.getElementById('rocket-img').src = 'https://cdn-icons-png.flaticon.com/512/1046/1046784.png'; // صورة انفجار
            
            addToHistory(currentMultiplier.toFixed(2));

            // إذا اللاعب ما سحب، يخسر
            if (userStatus === 'bet_placed') {
                actionBtn.innerText = "خسرت!";
                actionBtn.className = "btn-action waiting";
                userStatus = 'none';
            }

            // انتظار 3 ثواني ثم بدء جولة جديدة
            setTimeout(startRound, 3000);
        }

        // تشغيل اللعبة لأول مرة
        startRound();

    </script>
</body>
</html>
