<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rocket Crash - Multiplayer UI</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a0a10;
            --bg-panel: #161622;
            --ton-blue: #0098ea;
            --success: #00e676;
            --danger: #ff3b30;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --gold: #ffd700;
        }

        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-deep); color: var(--text-main); overflow-x: hidden; display: flex; flex-direction: column; height: 100vh; }

        /* الهيدر العلوي */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; z-index: 100; position: sticky; top: 0; background: var(--bg-deep); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .online-status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--success); font-weight: bold; }
        .dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .balance-box { background: rgba(255,255,255,0.08); padding: 5px 12px; border-radius: 20px; font-weight: 900; font-size: 15px; border: 1px solid rgba(255,255,255,0.1); }

        /* منطقة اللعبة (الصاروخ) */
        .rocket-page { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .game-area { height: 40vh; min-height: 300px; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; flex-direction: column; border-bottom: 2px solid #1a1a24; flex-shrink: 0; }
        .stars { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: url('https://www.transparenttextures.com/patterns/stardust.png'); opacity: 0.3; }
        
        .status-text { font-size: 14px; color: var(--text-muted); letter-spacing: 1px; margin-bottom: 5px; z-index: 10; font-weight: bold; }
        .multiplier { font-size: 85px; font-weight: 900; z-index: 10; text-shadow: 0 0 20px rgba(255,255,255,0.1); transition: color 0.2s; margin-top: -15px; }
        
        /* الصاروخ والأنيميشن الفخم */
        .rocket-container { position: absolute; bottom: 10%; left: 15%; z-index: 5; display: none; }
        .rocket-img { width: 90px; filter: drop-shadow(0 10px 20px rgba(0, 152, 234, 0.5)); }
        
        /* اهتزاز الصاروخ أثناء الطيران */
        .flying-anim { animation: rocketThrust 0.1s infinite alternate; }
        @keyframes rocketThrust { 0% { transform: translate(0, 0) rotate(45deg); } 100% { transform: translate(-2px, 2px) rotate(45deg); } }
        
        .trail-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 4; pointer-events: none; }
        .trail-path { fill: none; stroke: var(--gold); stroke-width: 5; stroke-linecap: round; filter: drop-shadow(0 0 10px rgba(255, 215, 0, 1)); }

        /* منطقة التحكم والرهانات الحية */
        .controls-section { padding: 20px; background: var(--bg-deep); flex: 1; }
        
        .btn-main { width: 100%; padding: 20px; border-radius: 16px; font-size: 22px; font-weight: 900; color: white; border: none; cursor: pointer; transition: 0.2s; background: linear-gradient(90deg, #5d2de2, #0098ea); box-shadow: 0 5px 15px rgba(93, 45, 226, 0.4); font-family: 'Cairo'; margin-bottom: 25px; }
        .btn-main:active { transform: scale(0.96); }
        .btn-main.cancel { background: #d35400; box-shadow: 0 5px 15px rgba(211, 84, 0, 0.4); }
        .btn-main.cashout { background: var(--success); color: #000; box-shadow: 0 5px 15px rgba(0, 230, 118, 0.4); }

        /* ================= قائمة اللاعبين (Live Bets) ================= */
        .live-bets-header { display: flex; justify-content: space-between; font-size: 14px; font-weight: bold; color: var(--text-muted); margin-bottom: 10px; padding: 0 10px; }
        .players-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 30px; }
        .player-card { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.03); padding: 12px 15px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.05); transition: 0.3s; }
        
        .player-info { display: flex; align-items: center; gap: 10px; }
        .player-avatar { width: 35px; height: 35px; border-radius: 50%; border: 2px solid #333; }
        .player-name { font-size: 14px; font-weight: bold; }
        .player-bet { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
        
        .player-profit { font-weight: 900; font-size: 16px; transition: 0.2s; }
        .player-card.cashed { background: rgba(0, 230, 118, 0.1); border-color: rgba(0, 230, 118, 0.3); }
        .player-card.cashed .player-profit { color: var(--success); }
        .player-card.crashed { background: rgba(255, 59, 48, 0.1); border-color: rgba(255, 59, 48, 0.3); opacity: 0.7; }
        .player-card.crashed .player-profit { color: var(--danger); }

        /* نافذة إدخال الرهان (Modal) */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; display: none; backdrop-filter: blur(5px); }
        .modal { position: fixed; bottom: -100%; left: 0; width: 100%; background: var(--bg-panel); border-top-left-radius: 24px; border-top-right-radius: 24px; z-index: 1001; transition: 0.3s; padding: 25px; box-shadow: 0 -10px 40px rgba(0,0,0,0.8); }
        .modal-header { display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; margin-bottom: 20px; }
        .input-box { background: #0a0a10; border: 1px solid #333; border-radius: 12px; display: flex; align-items: center; padding: 15px; margin-bottom: 20px; }
        .input-box input { flex: 1; background: transparent; border: none; color: white; font-size: 22px; font-weight: bold; outline: none; }
        .confirm-btn { width: 100%; padding: 18px; border-radius: 14px; font-size: 18px; font-weight: 900; background: var(--ton-blue); color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <div class="online-status"><div class="dot"></div> <span id="online-count">124</span> online</div>
        <div class="balance-box">💎 <span id="main-balance">0.00</span></div>
    </div>

    <div class="rocket-page">
        <div class="game-area">
            <div class="stars"></div>
            <svg class="trail-svg" preserveAspectRatio="none"><path id="flight-path" class="trail-path" d="" /></svg>

            <div class="status-text" id="status-text">NEXT ROUND IN</div>
            <div class="multiplier" id="multi-text">5</div>
            
            <div class="rocket-container" id="rocket">
                <img src="https://cdn-icons-png.flaticon.com/512/3256/3256114.png" class="rocket-img flying-anim" id="rocket-img">
            </div>
        </div>

        <div class="controls-section">
            <button class="btn-main" id="action-btn" onclick="handleAction()">ضع مبلغك (Place Bet)</button>

            <div class="live-bets-header">
                <span>Players</span>
                <span>Profit / Multiplier</span>
            </div>
            
            <div class="players-list" id="players-list">
                </div>
        </div>
    </div>

    <div class="overlay" id="overlay" onclick="closeModal()"></div>
    <div class="modal" id="bet-modal">
        <div class="modal-header">
            <span>Bet Amount</span>
            <span onclick="closeModal()" style="cursor:pointer; color:var(--text-muted);">✕</span>
        </div>
        <div class="input-box">
            <input type="number" id="bet-input" value="1.00" step="0.5" min="0.5">
            <span style="color:var(--ton-blue); font-weight:bold;">TON 💎</span>
        </div>
        <button class="confirm-btn" onclick="confirmBet()">تأكيد الرهان</button>
    </div>

    <script>
        // ================= نظام الحفظ (Persistence) =================
        // هذا يخلي الرصيد ينحفظ بتليفون اللاعب حتى لو طلع ورجع
        let balance = parseFloat(localStorage.getItem('user_balance'));
        if (isNaN(balance)) balance = 100.00; // رصيد البداية لأول مرة
        
        function updateBalance(amount) {
            balance += amount;
            document.getElementById('main-balance').innerText = balance.toFixed(2);
            localStorage.setItem('user_balance', balance.toFixed(2)); // حفظ الرصيد
        }
        updateBalance(0); // تحديث الشاشة بالبداية

        // ================= متغيرات اللعبة =================
        let gameState = 'waiting'; 
        let currentMultiplier = 1.00;
        let crashPoint = 1.00;
        let animationTime = 0;
        let gameInterval;
        
        let myBetAmount = 0;
        let myBetPlaced = false;
        let amICashedOut = false;
        let queuedBet = 0; // للرهان أثناء الطيران

        // عناصر الشاشة
        const multiText = document.getElementById('multi-text');
        const statusText = document.getElementById('status-text');
        const rocket = document.getElementById('rocket');
        const rocketImg = document.getElementById('rocket-img');
        const flightPath = document.getElementById('flight-path');
        const actionBtn = document.getElementById('action-btn');
        const playersList = document.getElementById('players-list');

        // ================= نظام اللاعبين الوهميين (Multiplayer Simulation) =================
        const fakeNames = ["Ali", "Omar", "Dexter", "Sarah", "John_99", "CryptoKing", "Murtadha", "Ahmad_IQ", "Zoro"];
        let livePlayers = [];

        function generateFakePlayers() {
            livePlayers = [];
            playersList.innerHTML = '';
            let numPlayers = Math.floor(Math.random() * 4) + 3; // من 3 إلى 6 لاعبين يدخلون كل جولة
            
            document.getElementById('online-count').innerText = Math.floor(Math.random() * 50) + 100;

            for(let i=0; i<numPlayers; i++) {
                let name = fakeNames[Math.floor(Math.random() * fakeNames.length)];
                let bet = (Math.random() * 10 + 0.5).toFixed(2);
                let targetCashout = (Math.random() * 3 + 1.1).toFixed(2); // الرقم اللي راح يسحب عنده
                
                livePlayers.push({
                    id: 'player_' + i,
                    name: name,
                    bet: bet,
                    target: targetCashout,
                    cashedOut: false
                });

                // رسم اللاعب بالشاشة
                playersList.innerHTML += `
                    <div class="player-card" id="card_player_${i}">
                        <div class="player-info">
                            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=${name}" class="player-avatar">
                            <div>
                                <div class="player-name">${name}</div>
                                <div class="player-bet">${bet} 💎</div>
                            </div>
                        </div>
                        <div class="player-profit" id="profit_player_${i}">-</div>
                    </div>
                `;
            }
        }

        function updateFakePlayers(currentMulti) {
            livePlayers.forEach(p => {
                if (!p.cashedOut) {
                    let liveProfit = (p.bet * currentMulti).toFixed(2);
                    document.getElementById('profit_player_' + p.id).innerText = liveProfit + ' 💎';
                    
                    // إذا وصل للرقم اللي يريده، يسحب ويصير أخضر!
                    if (currentMulti >= p.target) {
                        p.cashedOut = true;
                        document.getElementById('card_player_' + p.id).classList.add('cashed');
                        document.getElementById('profit_player_' + p.id).innerText = liveProfit + ' 💎 (' + currentMulti.toFixed(2) + 'x)';
                    }
                }
            });
        }

        function crashFakePlayers() {
            livePlayers.forEach(p => {
                if (!p.cashedOut) {
                    document.getElementById('card_player_' + p.id).classList.add('crashed');
                    document.getElementById('profit_player_' + p.id).innerText = '-' + p.bet + ' 💎';
                }
            });
        }

        // ================= دوال الرهان =================
        function handleAction() {
            if (queuedBet > 0) {
                updateBalance(queuedBet); queuedBet = 0;
                actionBtn.innerText = "ضع مبلغك"; actionBtn.className = "btn-main";
            }
            else if (gameState === 'waiting') {
                if (myBetPlaced) {
                    updateBalance(myBetAmount); myBetPlaced = false; myBetAmount = 0;
                    actionBtn.innerText = "ضع مبلغك"; actionBtn.className = "btn-main";
                    document.getElementById('my_card')?.remove(); // مسح بطاقتي
                } else { document.getElementById('overlay').style.display = 'block'; document.getElementById('bet-modal').style.bottom = '0'; }
            } 
            else if (gameState === 'flying') {
                if (myBetPlaced && !amICashedOut) { manualCashout(); } 
                else { document.getElementById('overlay').style.display = 'block'; document.getElementById('bet-modal').style.bottom = '0'; }
            }
            else if (gameState === 'crashed') {
                document.getElementById('overlay').style.display = 'block'; document.getElementById('bet-modal').style.bottom = '0';
            }
        }

        function closeModal() {
            document.getElementById('bet-modal').style.bottom = '-100%';
            setTimeout(() => { document.getElementById('overlay').style.display = 'none'; }, 300);
        }

        function confirmBet() {
            let amount = parseFloat(document.getElementById('bet-input').value);
            if (amount > balance) { alert("رصيدك غير كافٍ!"); return; }
            
            updateBalance(-amount);

            if (gameState === 'waiting') {
                myBetPlaced = true; myBetAmount = amount; amICashedOut = false;
                actionBtn.innerText = "إلغاء الرهان"; actionBtn.className = "btn-main cancel";
                
                // إضافة اسمك للقائمة!
                playersList.innerHTML = `
                    <div class="player-card" id="my_card" style="border-color:var(--ton-blue);">
                        <div class="player-info">
                            <img src="https://via.placeholder.com/35" class="player-avatar">
                            <div><div class="player-name">أنت (YOU)</div><div class="player-bet">${amount} 💎</div></div>
                        </div>
                        <div class="player-profit" id="my_profit">في الانتظار</div>
                    </div>
                ` + playersList.innerHTML;

            } else {
                queuedBet = amount;
                actionBtn.innerText = "انتظر الجولة القادمة (إلغاء)"; actionBtn.className = "btn-main cancel";
            }
            closeModal();
        }

        function manualCashout() {
            if(!myBetPlaced || amICashedOut) return;
            amICashedOut = true;
            let winAmount = myBetAmount * currentMultiplier;
            updateBalance(winAmount);
            
            actionBtn.innerText = `ربحت ${winAmount.toFixed(2)} 💎`; actionBtn.className = "btn-main cashout";
            
            // تحديث بطاقتي باللون الأخضر
            let myCard = document.getElementById('my_card');
            if(myCard) {
                myCard.classList.add('cashed');
                document.getElementById('my_profit').innerText = winAmount.toFixed(2) + ' 💎';
            }
        }

        // ================= محرك اللعبة =================
        function startRound() {
            gameState = 'waiting'; currentMultiplier = 1.00; animationTime = 0;
            crashPoint = (Math.random() < 0.05) ? 1.00 : Math.max(1.01, (0.99 / Math.random())).toFixed(2);
            
            rocket.style.display = 'none'; flightPath.setAttribute('d', '');
            multiText.style.color = 'var(--text-main)'; statusText.innerText = "NEXT ROUND IN";
            rocketImg.src = "https://cdn-icons-png.flaticon.com/512/3256/3256114.png"; // صاروخ كلاسيكي
            rocketImg.classList.remove('flying-anim'); // إيقاف الاهتزاز بالانتظار

            generateFakePlayers();

            if (queuedBet > 0) {
                myBetPlaced = true; myBetAmount = queuedBet; queuedBet = 0; amICashedOut = false;
                actionBtn.innerText = "إلغاء الرهان"; actionBtn.className = "btn-main cancel";
                playersList.innerHTML = `
                    <div class="player-card" id="my_card" style="border-color:var(--ton-blue);">
                        <div class="player-info"><img src="https://via.placeholder.com/35" class="player-avatar"><div><div class="player-name">أنت (YOU)</div><div class="player-bet">${myBetAmount} 💎</div></div></div>
                        <div class="player-profit" id="my_profit">في الانتظار</div>
                    </div>
                ` + playersList.innerHTML;
            } else if (!myBetPlaced) {
                actionBtn.innerText = "ضع مبلغك (Place Bet)"; actionBtn.className = "btn-main";
            }

            let countdown = 5;
            let waitInterval = setInterval(() => {
                multiText.innerText = countdown; countdown--;
                if (countdown < 0) { clearInterval(waitInterval); launchRocket(); }
            }, 1000);
        }

        function launchRocket() {
            gameState = 'flying'; statusText.innerText = "CURRENT PAYOUT";
            rocket.style.display = 'block';
            rocketImg.classList.add('flying-anim'); // تشغيل اهتزاز الصاروخ!
            
            if (myBetPlaced && !amICashedOut) { actionBtn.innerText = "سحب (Cashout)"; actionBtn.className = "btn-main"; }

            gameInterval = setInterval(() => {
                animationTime += 0.03;
                currentMultiplier += 0.002 * Math.pow(animationTime, 1.3);
                multiText.innerText = currentMultiplier.toFixed(2) + "x";

                // تحديث أرباح اللاعبين الوهميين وأرباحي
                updateFakePlayers(currentMultiplier);
                if (myBetPlaced && !amICashedOut && document.getElementById('my_profit')) {
                    document.getElementById('my_profit').innerText = (myBetAmount * currentMultiplier).toFixed(2) + ' 💎';
                }

                // حركة الصاروخ
                let startX = window.innerWidth * 0.15;
                let startY = document.querySelector('.game-area').offsetHeight * 0.7; 
                let currentX = startX + (animationTime * 25);
                let currentY = startY - (Math.pow(animationTime, 1.5) * 3); 
                
                if(currentY < 50) currentY = 50; if(currentX > window.innerWidth * 0.7) currentX = window.innerWidth * 0.7;

                // الصاروخ يتحرك بس كلاس الاهتزاز شغال وياه
                rocket.style.transform = `translate(${currentX - startX}px, ${currentY - startY}px)`;
                
                let pathD = `M ${startX+30} ${startY+40} Q ${currentX} ${startY+20} ${currentX+30} ${currentY+60}`;
                flightPath.setAttribute('d', pathD);

                if (currentMultiplier >= crashPoint) crashRocket();
            }, 40);
        }

        function crashRocket() {
            clearInterval(gameInterval); gameState = 'crashed';
            multiText.style.color = 'var(--danger)'; statusText.innerText = "CRASHED AT";
            rocketImg.src = 'https://cdn-icons-png.flaticon.com/512/1046/1046784.png'; // صورة الانفجار
            rocketImg.classList.remove('flying-anim'); // إيقاف الاهتزاز
            
            crashFakePlayers(); // تلوين اللاعبين اللي خسروا بالأحمر

            if (myBetPlaced && !amICashedOut) {
                actionBtn.innerText = "خسرت!"; actionBtn.className = "btn-main cancel"; myBetPlaced = false;
                let myCard = document.getElementById('my_card');
                if(myCard) { myCard.classList.add('crashed'); document.getElementById('my_profit').innerText = "خسارة"; }
            } else if (myBetPlaced && amICashedOut) { myBetPlaced = false; }

            setTimeout(startRound, 3000);
        }

        startRound();
    </script>
</body>
</html>
