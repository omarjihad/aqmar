<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NFT Battle - Real Integration</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        /* الستايل الأسطوري مالتك نفسه، ما غيرته بس ضفت بعض اللمسات للصور */
        :root { --bg-main: #13131a; --bg-card: #1c1c24; --ton-blue: #0098ea; --text-main: #ffffff; --text-muted: #8e8e93; --gold: #ffd700; }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; user-select: none; }
        body { background-color: var(--bg-main); color: var(--text-main); overflow-x: hidden; }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: rgba(19, 19, 26, 0.9); backdrop-filter: blur(10px); position: fixed; top: 0; width: 100%; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #333; }
        .balance-amount { font-size: 18px; font-weight: 900; color: #00e6ff; text-shadow: 0 0 10px rgba(0, 230, 255, 0.4); }
        
        /* شريط الجوائز اللايف - وهمي حالياً للتوضيح */
        .drops-bar { display: flex; gap: 10px; overflow-x: auto; padding: 10px; background: rgba(0,0,0,0.5); margin-bottom: 20px; }
        .drops-bar::-webkit-scrollbar { display: none; }
        .drop-box { min-width: 45px; height: 45px; border-radius: 12px; background: #2a2a35; display: flex; justify-content: center; align-items: center; font-size: 20px; }
        .drop-box.rare { background: linear-gradient(135deg, #7b2cbf, #1c1c24); }

        .main-container { padding: 130px 15px 90px 15px; }

        .cases-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .case-card { background: var(--bg-card); border-radius: 16px; padding: 20px 10px; text-align: center; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; transition: transform 0.1s; }
        .case-card:active { transform: scale(0.95); }
        /* تصميم صور مالت التليجرام الحقيقية المفرغة باللون الأسود مالتها */
        .case-img { width: 90px; height: 90px; object-fit: contain; margin: 0 auto 10px auto; display: block; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5)); }
        .case-price { background: rgba(0, 152, 234, 0.15); color: var(--ton-blue); padding: 5px 12px; border-radius: 8px; font-weight: 900; }

        /* الأزرار النصفية للـ Upgrade/PVP */
        .special-cases { display: flex; gap: 15px; margin-bottom: 20px; }
        .special-card { flex: 1; background: linear-gradient(135deg, #2a2a35, #1c1c24); border-radius: 16px; padding: 15px; text-align: center; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); }

        /* مودال الكود والمطالبة */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 200; display: none; justify-content: center; align-items: center; }
        .modal-content { background: var(--bg-card); width: 90%; border-radius: 20px; padding: 25px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .open-btn { background: var(--gold); color: black; border: none; padding: 15px; width: 100%; border-radius: 12px; font-size: 18px; font-weight: 900; margin-top: 10px; font-family: 'Cairo'; cursor: pointer;}
    </style>
</head>
<body>

    <div class="header">
        <div class="user-info">
            <div class="avatar" id="user-img"></div>
            <div style="font-size: 14px; font-weight: bold;" id="user-name">لاعب جديد</div>
        </div>
        <div class="balance-amount">💎 10.00</div>
    </div>

    <div class="main-container">
        
        <div class="special-cases">
            <div class="special-card" onclick="openPromoModal()">
                <div style="font-size: 30px;">🎁</div>
                <h4 style="margin-top: 10px; color: var(--gold);">صندوق الأكواد</h4>
            </div>
            <div class="special-card">
                <div style="font-size: 30px;">📅</div>
                <h4 style="margin-top: 10px; color: #00ffcc;">صندوق مجاني</h4>
            </div>
        </div>

        <h3 style="margin-bottom: 15px; font-style: italic;">PREMIUM CASES</h3>
        <div class="cases-grid" id="cases-grid">
            </div>
    </div>

    <div class="modal-overlay" id="promo-modal">
        <div class="modal-content">
            <h2 id="modal-title" style="color: var(--gold);">استرداد كود الهدية</h2>
            <p style="color: var(--text-muted); margin-top: 10px;">أدخل كود مالت المطور للحصول على TON:</p>
            <input type="text" id="promo-input" placeholder="أدخل الكود هنا..." style="width: 100%; padding: 15px; border-radius: 10px; border: none; background: #222; color: white; text-align: center; margin: 20px 0; font-size: 18px; font-weight: bold; font-family: 'Cairo';">
            <button class="open-btn" onclick="claimCode()">استرداد الكود 🎁</button>
            <p style="margin-top: 15px; color: var(--text-muted); font-size: 14px; cursor: pointer;" onclick="closePromoModal()">إلغاء</p>
        </div>
    </div>

    <script>
        // تكامل مع تليجرام
        const tg = window.Telegram.WebApp;
        tg.expand();
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('user-name').innerText = user.first_name;
            if (user.photo_url) {
                document.getElementById('user-img').style.backgroundImage = `url('${user.photo_url}')`;
                document.getElementById('user-img').style.backgroundSize = 'cover';
            }
        }

        // 1. توليد الصناديق بالصور الحقيقية مالتك (مثال: Plush Pepe)
        const casesGrid = document.getElementById('cases-grid');
        // هنا يمكنك جلب الصناديق والأسعار من ملف items.json الذي تم شرحه لاحقاً
        // حالياً سنستخدم بيانات وهمية للتخطيط الشكلي الأسطوري مالتك
        const casesData = [
            { id: "case_1", name: "Plush Pepe Box", price: 49, img: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Placeholder_box.svg/100px-Placeholder_box.svg.png" }, // Plush Pepe مفرغة
            { id: "case_rare", name: "Shadow Case", price: 250, img: "https://cdn-icons-png.flaticon.com/512/1043/1043446.png" },
            { id: "elite_vip", name: "Elite VIP", price: 9999, img: "https://cdn-icons-png.flaticon.com/512/2632/2632074.png" }
        ];

        casesData.forEach(c => {
            casesGrid.innerHTML += `
                <div class="case-card" onclick="sendOpenCase('${c.id}', ${c.price})">
                    <img src="${c.img}" class="case-img">
                    <div class="case-name">${c.name}</div>
                    <div class="case-price">${c.price} 💎</div>
                </div>
            `;
        });

        // دوال إرسال البيانات للتليجرام (Integration API)
        function sendOpenCase(caseId, price) {
            // إرسال كول باك للتليجرام لفتح الصندوق الحقيقي
            const data = { type: 'open_case', case_id: caseId, price: price };
            tg.sendData(JSON.stringify(data));
        }

        function openPromoModal() {
            document.getElementById('promo-modal').style.display = 'flex';
        }
        function closePromoModal() {
            document.getElementById('promo-modal').style.display = 'none';
        }

        function claimCode() {
            const code = document.getElementById('promo-input').value;
            if (code) {
                // إرسال بيانات الكود للتليجرام
                const data = { type: 'claim_code', code: code };
                tg.sendData(JSON.stringify(data));
                closePromoModal();
            } else {
                tg.showAlert("❌ يرجى إدخال الكود أولاً.");
            }
        }
    </script>
</body>
</html>
