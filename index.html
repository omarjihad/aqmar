<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محلل الشطرنج الذكي</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #1e1e1e; color: white; padding: 20px; }
        #board { width: 100%; max-width: 400px; margin: 0 auto 20px auto; }
        .btn { padding: 10px 20px; margin: 5px; background: #0088cc; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #best-move-display { margin-top: 20px; font-size: 1.2em; font-weight: bold; color: #4CAF50; }
    </style>
</head>
<body>

    <h2>محلل الشطرنج ♟️</h2>
    <div id="board"></div>
    
    <button class="btn" onclick="getBestMove()">أوجد أفضل نقلة للذكاء الاصطناعي 🧠</button>
    <button class="btn" onclick="flipBoard()">قلب الرقعة 🔄</button>
    <button class="btn" onclick="resetBoard()">إعادة اللعبة ♻️</button>

    <div id="best-move-display">العب نقلتك ثم اضغط على الزر لمعرفة أفضل رد!</div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
        var board = null;
        var game = new Chess();

        // إعدادات الرقعة
        var config = {
            draggable: true,
            position: 'start',
            onDrop: handleMove
        };
        board = Chessboard('board', config);

        // وظيفة التعامل مع النقلات (للتأكد أن النقلة قانونية)
        function handleMove(source, target) {
            var move = game.move({
                from: source,
                to: target,
                promotion: 'q' // دائماً ترقية لوزير للتبسيط
            });

            if (move === null) return 'snapback'; // إرجاع القطعة إذا النقلة خطأ
        }

        // جلب أفضل نقلة من Stockfish API
        function getBestMove() {
            var fen = game.fen(); // أخذ حالة الرقعة الحالية
            document.getElementById('best-move-display').innerText = "جاري التفكير...";

            // استخدام API مجاني لمحرك Stockfish
            fetch(`https://stockfish.online/api/s/v2.php?fen=${fen}&depth=12`)
                .then(response => response.json())
                .then(data => {
                    if(data.success) {
                        let bestMove = data.bestmove.split(" ")[1];
                        document.getElementById('best-move-display').innerText = "أفضل نقلة هي: " + bestMove;
                    } else {
                        document.getElementById('best-move-display').innerText = "حدث خطأ في التحليل.";
                    }
                })
                .catch(err => {
                    document.getElementById('best-move-display').innerText = "فشل الاتصال بالمحرك!";
                });
        }

        function flipBoard() { board.flip(); }
        function resetBoard() { game.reset(); board.start(); document.getElementById('best-move-display').innerText = ""; }
    </script>
</body>
</html>
